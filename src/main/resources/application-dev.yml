spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${DB_NAME_DEV}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # 수동 실행 방지

  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}
        chat:
          options:
            model: gemini-2.0-flash
            temperature: 0.7  # AI 피드백 생성 시 다양성 확보

# AI 피드백 설정
ai:
  feedback:
    enabled: true
    max-records-per-request: 100  # AI에게 전송할 최대 레코드 수
    retry-attempts: 3  # AI API 실패 시 재시도 횟수