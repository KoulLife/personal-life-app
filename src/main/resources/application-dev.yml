spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${DB_NAME_DEV}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # 수동 실행 방지

  ai:
    google:
      genai:
        api-key: ${GEMINI_KEY}
        chat:
          options:
            model: gemini-2.0-flash
            temperature: 0.7  # AI 피드백 생성 시 다양성 확보

  mail:
    host: smtp.gmail.com
    port: 587 # 메일 서버의 포트 번호 (기본적으로 587 사용)
    username: ${GMAIL_URL} # Gmail 주소
    password: ${GMAIL_SECREt} # Gmail 앱 비밀번호
    default-encoding: UTF-8 # 메일 본문의 기본 인코딩
    properties:
      mail:
        mime:
          charset: UTF-8 # 메일 본문의 MIME 문자셋
        smtp:
          auth: true # SMTP 인증 사용 여부
          timeout: 5000 # SMTP 연결 타임아웃 (ms)
          starttls:
            enable: true # TLS 보안 연결 사용 여부


# AI 피드백 설정
ai:
  feedback:
    enabled: true
    max-records-per-request: 100  # AI에게 전송할 최대 레코드 수
    retry-attempts: 3  # AI API 실패 시 재시도 횟수